name: Bug report
description: Report a reproducible problem with HabiStride.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid including personal habit data.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence that demonstrates the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 18, macOS 15
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console errors, or whether the issue happens with fresh data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched for an existing issue.
          required: true
        - label: I reproduced this with a clean local state where possible.
